name: Build RUNA H3 CUDA 13 experimental image

on:
  push:
    branches: [test-cuda13]
    paths:
      - Dockerfile
      - bootstrap.sh
      - model_downloads.py
      - RUNA_H3_Cuda13.json
      - 'NEW - Music Video.json'
      - H3_ComfyUI_Official_Ref2V.json
      - .github/workflows/build-cuda13.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Enable Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish experimental image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/mikado364578/runa-h3-runpod:cuda13-test-v2
